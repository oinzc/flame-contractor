name: Build Windows Desktop Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: 构建 Windows NSIS 安装包 (x64)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12 与桌面打包依赖
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: 校验全端版本号与 Tag 一致性
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            python scripts/bump_version.py --check --tag "${{ github.ref_name }}"
          } else {
            python scripts/bump_version.py --check
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: 构建前端与单测门禁
        working-directory: frontend
        env:
          VITE_FEEDBACK_ENDPOINT: ${{ vars.FLAME_FEEDBACK_ENDPOINT }}
        run: |
          npm ci
          npm test
          npm run build

      - name: 安装后端打包依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-desktop.txt

      - name: 打包 Python 桌面 Sidecar
        run: python scripts/build_desktop_backend.py

      - name: 冒烟校验独立 Sidecar 可执行文件
        shell: pwsh
        run: |
          $tmpData = Join-Path $env:RUNNER_TEMP "flame-sidecar-smoke"
          New-Item -ItemType Directory -Force -Path $tmpData | Out-Null
          $token = "ci-desktop-handshake-smoke-token-0123456789abcdef"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "desktop/src-tauri/resources/backend/flame-backend.exe").Path
          $psi.UseShellExecute = $false
          $psi.Environment["FLAME_PORT"] = "18199"
          $psi.Environment["FLAME_DATA_DIR"] = $tmpData
          $psi.Environment["FLAME_DESKTOP_MODE"] = "true"
          $psi.Environment["FLAME_DESKTOP_TOKEN"] = $token
          $psi.Environment["FLAME_SERVE_FRONTEND"] = "false"
          $proc = [System.Diagnostics.Process]::Start($psi)
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { break }
              try {
                $h = Invoke-RestMethod -Uri "http://127.0.0.1:18199/health" -TimeoutSec 2
                if ($h.status -eq "ok" -and $h.database -eq "ready") { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) {
              $logFile = Join-Path $tmpData "logs/backend.log"
              if (Test-Path $logFile) { Get-Content $logFile -Tail 100 }
              throw "Sidecar 未能在超时内就绪 (HasExited=$($proc.HasExited))"
            }
            $me = Invoke-RestMethod -Uri "http://127.0.0.1:18199/api/auth/me" -Headers @{ Authorization = "Bearer $token" } -TimeoutSec 5
            if ($me.username -ne "local" -or -not $me.isSuperuser) { throw "桌面免登握手校验失败" }
            Write-Output "SIDECAR_SMOKE_OK"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              $proc.Kill()
              $proc.WaitForExit(5000) | Out-Null
            }
          }

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装桌面端依赖并构建 Windows NSIS 安装包
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: 打包 Windows 便携版 (.zip) 与 SHA-256 校验文件
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            $version = (python -c "from pathlib import Path; import sys; sys.path.insert(0, 'scripts'); import bump_version; print(bump_version.check_repo_versions(Path('.')))").Trim()
            if ($LASTEXITCODE -ne 0 -or -not $version) { exit 1 }
          }

          $distDir = "desktop/release-dist"
          if (Test-Path $distDir) { Remove-Item -Recurse -Force $distDir }
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $installers = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe"
          if (-not $installers -or $installers.Count -eq 0) {
            throw "未找到 Windows NSIS 安装包产物"
          }
          foreach ($inst in $installers) {
            Copy-Item $inst.FullName -Destination $distDir
          }

          python scripts/release_packaging.py windows-portable `
            --exe desktop/src-tauri/target/release/flame-contractor-desktop.exe `
            --backend-dir desktop/src-tauri/resources/backend `
            --version $version `
            --out-dir $distDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $hashTargets = @(Get-ChildItem $distDir -File | Where-Object { $_.Extension -in @('.exe', '.zip') } | ForEach-Object { $_.FullName })
          if ($hashTargets.Count -lt 2) {
            throw "desktop/release-dist 产物数量不足，预期包含 .exe 与便携 .zip"
          }
          python scripts/release_packaging.py sha256sums `
            --output "$distDir/SHA256SUMS-windows.txt" `
            --files @hashTargets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传 Windows 安装包产物
        uses: actions/upload-artifact@v7
        with:
          name: flame-contractor-windows-x64-installer
          path: desktop/release-dist/*
          if-no-files-found: error

      - name: 附加安装包到 GitHub Release（仅 Tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --generate-notes
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag *> $null
              if ($LASTEXITCODE -ne 0) {
                throw "无法创建或读取 GitHub Release: $tag"
              }
            }
          }
          $files = Get-ChildItem "desktop/release-dist" -File
          foreach ($f in $files) {
            gh release upload $tag $f.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
