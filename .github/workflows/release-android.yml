name: Build Android Standalone APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: 构建独立 Android APK (Universal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验全端版本号与 Tag 一致性
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python3 scripts/bump_version.py --check --tag "${GITHUB_REF_NAME}"
          else
            python3 scripts/bump_version.py --check
          fi
          python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 解析版本号与更新源配置
        id: meta
        env:
          RAW_UPDATE_MANIFEST_URL: ${{ vars.FLAME_UPDATE_MANIFEST_URL }}
          RAW_UPDATE_BASE_URL: ${{ vars.FLAME_UPDATE_BASE_URL }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_CODE="$(python3 scripts/android_release_manifest.py --compute-version-code "${VERSION}")"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            VERSION="dev-${SHORT_SHA}"
            VERSION_CODE="${RUN_NUMBER}"
          fi

          UPDATE_BASE_URL="$(printf '%s' "${RAW_UPDATE_BASE_URL}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's:/*$::')"
          UPDATE_MANIFEST_URL="$(printf '%s' "${RAW_UPDATE_MANIFEST_URL}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "${UPDATE_MANIFEST_URL}" && -n "${UPDATE_BASE_URL}" ]]; then
            UPDATE_MANIFEST_URL="${UPDATE_BASE_URL}/android/latest.json"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "update_base_url=${UPDATE_BASE_URL}" >> "${GITHUB_OUTPUT}"
          echo "update_manifest_url=${UPDATE_MANIFEST_URL}" >> "${GITHUB_OUTPUT}"

      - name: 发布前契约、单测与 Lint 门禁
        working-directory: android
        run: ./gradlew verifySelectorBundleSync :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain

      - name: 构建 Android APK（支持可选正式签名密钥）
        id: build_apk
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLAME_FEEDBACK_ENDPOINT: ${{ vars.FLAME_FEEDBACK_ENDPOINT }}
          FLAME_UPDATE_MANIFEST_URL: ${{ steps.meta.outputs.update_manifest_url }}
          VERSION_NAME: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p build-dist
          KEYSTORE_TMP=""
          cleanup() {
            if [[ -n "${KEYSTORE_TMP}" && -f "${KEYSTORE_TMP}" ]]; then
              rm -f "${KEYSTORE_TMP}"
            fi
          }
          trap cleanup EXIT

          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            KEYSTORE_TMP="${RUNNER_TEMP}/release-keystore.jks"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_TMP}"
            export ANDROID_KEYSTORE_PATH="${KEYSTORE_TMP}"
            ./gradlew :app:assembleRelease \
              -PversionName="${VERSION_NAME}" \
              -PversionCode="${VERSION_CODE}" \
              --no-daemon --console=plain
            cp "app/build/outputs/apk/release/app-release.apk" \
              "build-dist/FlameContractor-${VERSION_NAME}-android-universal-release.apk"
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::未检测到完整的 Android 签名 Secrets（ANDROID_KEYSTORE_*），本次回退生成可校验的 Debug 与未签名 Release APK，不会阻塞开源 Fork 构建。"
            ./gradlew :app:assembleDebug :app:assembleRelease \
              -PversionName="${VERSION_NAME}" \
              -PversionCode="${VERSION_CODE}" \
              --no-daemon --console=plain
            cp "app/build/outputs/apk/debug/app-debug.apk" \
              "build-dist/FlameContractor-${VERSION_NAME}-android-universal-debug.apk"
            cp "app/build/outputs/apk/release/app-release-unsigned.apk" \
              "build-dist/FlameContractor-${VERSION_NAME}-android-universal-release-unsigned.apk"
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: 上传 Android APK 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: flame-contractor-android-apk
          path: android/build-dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 发布签名 APK 与 latest.json 到 GitHub Release（仅 Tag 且已配置签名密钥）
        if: startsWith(github.ref, 'refs/tags/v') && steps.build_apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          FLAME_UPDATE_BASE_URL: ${{ steps.meta.outputs.update_base_url }}
          FLAME_UPDATE_MIN_VERSION_CODE: ${{ vars.FLAME_UPDATE_MIN_VERSION_CODE }}
        run: |
          set -euo pipefail
          APK_FILENAME="FlameContractor-${VERSION}-android-universal-release.apk"
          APK_PATH="android/build-dist/${APK_FILENAME}"
          MANIFEST_PATH="android/build-dist/latest.json"
          NOTES_FILE="${RUNNER_TEMP}/android-release-notes.md"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --generate-notes || gh release view "${TAG}" >/dev/null 2>&1
          fi

          gh release upload "${TAG}" "${APK_PATH}" --clobber

          RELEASE_BODY="$(gh release view "${TAG}" --json body -q .body || true)"
          if [[ -z "${RELEASE_BODY//[[:space:]]/}" ]]; then
            PREV_TAG="$(git describe --tags --match "v*" --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [[ -n "${PREV_TAG}" ]]; then
              RELEASE_BODY="$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:'- %s' -n 30 || true)"
              if [[ -z "${RELEASE_BODY//[[:space:]]/}" ]]; then
                RELEASE_BODY="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' -n 30 || true)"
              fi
            else
              RELEASE_BODY="$(git log -n 20 --no-merges --pretty=format:'- %s' || true)"
            fi
          fi
          printf '%s\n' "${RELEASE_BODY}" > "${NOTES_FILE}"

          MIN_VERSION_CODE="$(printf '%s' "${FLAME_UPDATE_MIN_VERSION_CODE:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "${MIN_VERSION_CODE}" ]]; then
            MIN_VERSION_CODE="0"
          fi

          if [[ -n "${FLAME_UPDATE_BASE_URL}" ]]; then
            MANIFEST_BASE_URL="${FLAME_UPDATE_BASE_URL}"
            APK_OBJECT_KEY="android/releases/${APK_FILENAME}"
          else
            MANIFEST_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
            APK_OBJECT_KEY="${APK_FILENAME}"
          fi

          python3 scripts/android_release_manifest.py --build-manifest \
            --apk "${APK_PATH}" \
            --version-name "${VERSION}" \
            --version-code "${VERSION_CODE}" \
            --base-url "${MANIFEST_BASE_URL}" \
            --apk-object-key "${APK_OBJECT_KEY}" \
            --release-page-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --changelog-file "${NOTES_FILE}" \
            --min-version-code "${MIN_VERSION_CODE}" \
            --output "${MANIFEST_PATH}"

          gh release upload "${TAG}" "${MANIFEST_PATH}" --clobber

      - name: 同步上传签名 APK 与 latest.json 到 Cloudflare R2（可选）
        if: startsWith(github.ref, 'refs/tags/v') && steps.build_apk.outputs.signed == 'true'
        env:
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          FLAME_UPDATE_BASE_URL: ${{ steps.meta.outputs.update_base_url }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_R2_ACCOUNT_ID}" || -z "${CF_R2_ACCESS_KEY_ID}" || -z "${CF_R2_SECRET_ACCESS_KEY}" || -z "${CF_R2_BUCKET}" || -z "${FLAME_UPDATE_BASE_URL}" ]]; then
            echo "::notice::未检测到完整的 Cloudflare R2 Secrets（CF_R2_*）或 FLAME_UPDATE_BASE_URL 变量，本次优雅跳过 R2 同步上传，不影响 GitHub Release 发布。"
            exit 0
          fi

          APK_FILENAME="FlameContractor-${VERSION}-android-universal-release.apk"
          APK_PATH="android/build-dist/${APK_FILENAME}"
          MANIFEST_PATH="android/build-dist/latest.json"
          R2_ENDPOINT="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          export AWS_ACCESS_KEY_ID="${CF_R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${CF_R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION="auto"
          export AWS_EC2_METADATA_DISABLED="true"
          export AWS_REQUEST_CHECKSUM_CALCULATION="when_required"
          export AWS_RESPONSE_CHECKSUM_VALIDATION="when_required"

          # 必须先上传 APK 再覆盖 latest.json，避免客户端读到新清单时 APK 尚未就绪
          aws s3 cp "${APK_PATH}" \
            "s3://${CF_R2_BUCKET}/android/releases/${APK_FILENAME}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/vnd.android.package-archive" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

          aws s3 cp "${MANIFEST_PATH}" \
            "s3://${CF_R2_BUCKET}/android/latest.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache, max-age=60" \
            --no-progress
