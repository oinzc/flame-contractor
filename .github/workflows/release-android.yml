name: Build Android Standalone APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: 构建独立 Android APK (Universal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验全端版本号与 Tag 一致性
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python3 scripts/bump_version.py --check --tag "${GITHUB_REF_NAME}"
          else
            python3 scripts/bump_version.py --check
          fi

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 解析版本号
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            VERSION="dev-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${{ github.run_number }}" >> "${GITHUB_OUTPUT}"

      - name: 发布前契约、单测与 Lint 门禁
        working-directory: android
        run: ./gradlew verifySelectorBundleSync :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain

      - name: 构建 Android APK（支持可选正式签名密钥）
        id: build_apk
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLAME_FEEDBACK_ENDPOINT: ${{ vars.FLAME_FEEDBACK_ENDPOINT }}
          VERSION_NAME: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p build-dist
          KEYSTORE_TMP=""
          cleanup() {
            if [[ -n "${KEYSTORE_TMP}" && -f "${KEYSTORE_TMP}" ]]; then
              rm -f "${KEYSTORE_TMP}"
            fi
          }
          trap cleanup EXIT

          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            KEYSTORE_TMP="${RUNNER_TEMP}/release-keystore.jks"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_TMP}"
            export ANDROID_KEYSTORE_PATH="${KEYSTORE_TMP}"
            ./gradlew :app:assembleRelease \
              -PversionName="${VERSION_NAME}" \
              -PversionCode="${VERSION_CODE}" \
              --no-daemon --console=plain
            cp "app/build/outputs/apk/release/app-release.apk" \
              "build-dist/FlameContractor-${VERSION_NAME}-android-universal-release.apk"
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::未检测到完整的 Android 签名 Secrets（ANDROID_KEYSTORE_*），本次回退生成可校验的 Debug 与未签名 Release APK，不会阻塞开源 Fork 构建。"
            ./gradlew :app:assembleDebug :app:assembleRelease \
              -PversionName="${VERSION_NAME}" \
              -PversionCode="${VERSION_CODE}" \
              --no-daemon --console=plain
            cp "app/build/outputs/apk/debug/app-debug.apk" \
              "build-dist/FlameContractor-${VERSION_NAME}-android-universal-debug.apk"
            cp "app/build/outputs/apk/release/app-release-unsigned.apk" \
              "build-dist/FlameContractor-${VERSION_NAME}-android-universal-release-unsigned.apk"
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: 上传 Android APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: flame-contractor-android-apk
          path: android/build-dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 附加已签名 Release APK 到 GitHub Release（仅 Tag 且已配置签名密钥）
        if: startsWith(github.ref, 'refs/tags/v') && steps.build_apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --generate-notes || gh release view "${TAG}" >/dev/null 2>&1
          fi
          for apk in android/build-dist/*-release.apk; do
            gh release upload "${TAG}" "${apk}" --clobber
          done
