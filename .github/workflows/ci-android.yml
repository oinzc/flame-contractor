name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "backend/app/execution/selectors_bundle.json"
      - ".github/workflows/ci-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "backend/app/execution/selectors_bundle.json"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-verify:
    name: Android 契约校验、单测、Lint 与 Debug APK 构建
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 运行选择器同步校验、单元测试、Lint 与 Debug 构建
        working-directory: android
        run: ./gradlew verifySelectorBundleSync :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain

      - name: 上传 Debug APK 产物
        uses: actions/upload-artifact@v7
        with:
          name: flame-contractor-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
