<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="焰之契约者 — 本机多账号抖音续火控制台" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>"
    />
    <title>焰之契约者 · Flame Contractor</title>
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('flame_theme_preference')
          var sysDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved =
            pref === 'dark' ? 'dark' : pref === 'light' ? 'light' : sysDark ? 'dark' : 'light'
          document.documentElement.dataset.theme = resolved
          document.documentElement.style.colorScheme = resolved
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0f1012' : '#ffffff')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
